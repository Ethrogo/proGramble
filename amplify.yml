version: 1
applications:
  - appRoot: web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - cd web && npm ci
        build:
          commands:
            - cd web && npm run build
      artifacts:
        baseDirectory: web/.next
        files:
          - "**/*"
      cache:
        paths:
          - web/node_modules/**/*
          - web/.next/cache/**/*
