spring.application.name=programble-api
spring.profiles.default=local

server.port=${SERVER_PORT:8080}

programble.environment=${PROGRAMBLE_ENV:local}
programble.api.base-path=${PROGRAMBLE_API_BASE_PATH:/api/v1}
programble.security.admin-api-token=${PROGRAMBLE_ADMIN_API_TOKEN:}
programble.odds.api-key=${PROGRAMBLE_ODDS_API_KEY:${ODDS_API_KEY:}}
programble.odds.base-url=${PROGRAMBLE_ODDS_BASE_URL:https://api.the-odds-api.com/v4/sports}
programble.odds.mlb-sport-key=${PROGRAMBLE_ODDS_MLB_SPORT_KEY:baseball_mlb}
programble.odds.mlb-pitcher-strikeouts-market-key=${PROGRAMBLE_ODDS_MLB_PITCHER_STRIKEOUTS_MARKET_KEY:pitcher_strikeouts}
programble.odds.event-discovery-market-key=${PROGRAMBLE_ODDS_EVENT_DISCOVERY_MARKET_KEY:h2h}
programble.odds.bookmakers=${PROGRAMBLE_ODDS_BOOKMAKERS:draftkings,fanduel,betmgm,williamhill_us}
programble.mlb.stats-api-base-url=${PROGRAMBLE_MLB_STATS_API_BASE_URL:https://statsapi.mlb.com/api/v1}
programble.jobs.scheduler-enabled=${PROGRAMBLE_JOBS_SCHEDULER_ENABLED:false}
programble.jobs.time-zone=${PROGRAMBLE_JOBS_TIME_ZONE:UTC}
programble.jobs.refresh-sports-data.cron=${PROGRAMBLE_JOBS_REFRESH_SPORTS_DATA_CRON:-}
programble.jobs.refresh-odds.cron=${PROGRAMBLE_JOBS_REFRESH_ODDS_CRON:-}
programble.jobs.refresh-derived-site-data.cron=${PROGRAMBLE_JOBS_REFRESH_DERIVED_SITE_DATA_CRON:-}
spring.datasource.url=${PROGRAMBLE_DB_URL:jdbc:h2:mem:programble;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE}
spring.datasource.username=${PROGRAMBLE_DB_USERNAME:sa}
spring.datasource.password=${PROGRAMBLE_DB_PASSWORD:}
spring.flyway.enabled=true
programble.database.url=${spring.datasource.url}
programble.database.username=${spring.datasource.username}
programble.database.password=${spring.datasource.password}

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${programble.environment}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s,5s

info.app.name=${spring.application.name}
info.app.environment=${programble.environment}
info.api.base-path=${programble.api.base-path}

logging.structured.format.console=${CONSOLE_LOG_STRUCTURED_FORMAT:logstash}
logging.structured.json.add.service=${spring.application.name}
logging.structured.json.add.environment=${programble.environment}
logging.level.root=${ROOT_LOG_LEVEL:INFO}
logging.level.com.programble.api=${APP_LOG_LEVEL:INFO}
