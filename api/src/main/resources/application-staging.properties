spring.config.activate.on-profile=staging

programble.environment=${PROGRAMBLE_ENV:staging}

server.port=${SERVER_PORT:8080}

programble.api.base-path=${PROGRAMBLE_API_BASE_PATH:/api/v1}
spring.datasource.url=${PROGRAMBLE_DB_URL:jdbc:postgresql://localhost:5432/programble}
spring.datasource.username=${PROGRAMBLE_DB_USERNAME:programble}
spring.datasource.password=${PROGRAMBLE_DB_PASSWORD:change-me}
spring.flyway.enabled=true
programble.database.url=${spring.datasource.url}
programble.database.username=${spring.datasource.username}
programble.database.password=${spring.datasource.password}

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.info.env.enabled=true
