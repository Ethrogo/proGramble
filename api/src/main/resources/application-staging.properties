spring.config.activate.on-profile=staging

programble.environment=${PROGRAMBLE_ENV:staging}

server.port=${SERVER_PORT:8080}

programble.api.base-path=${PROGRAMBLE_API_BASE_PATH:/api/v1}
programble.database.url=${PROGRAMBLE_DB_URL:jdbc:postgresql://localhost:5432/programble}
programble.database.username=${PROGRAMBLE_DB_USERNAME:programble}
programble.database.password=${PROGRAMBLE_DB_PASSWORD:change-me}

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.info.env.enabled=true
